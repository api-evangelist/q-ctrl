name: Q Ctrl
description: >-
  Q-CTRL builds infrastructure software to power the quantum future, delivering
  AI-driven quantum control, error-suppression, and performance-management tools
  that span quantum computing and quantum sensing. Its products — Boulder Opal
  (hardware design and control), Fire Opal (quantum error suppression), Black
  Opal (education), and Ironstone Opal (GPS-free quantum navigation) — are
  consumed primarily through official Python client libraries that authenticate
  against the Q-CTRL account service and call a hosted cloud GraphQL API at
  api.q-ctrl.com. Q-CTRL serves enterprise, defense, aerospace, and research
  customers and is ISO/IEC 27001:2022 certified.
